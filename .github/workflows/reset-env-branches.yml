# Reusable workflow: reset env/dev from main after production deploy.
# Call from codeitem deploy workflows (post-merge on main) or manual/scheduled.
# Aligned with GitLab .default-reset_env_branches behavior.

name: Reset env branches

on:
  workflow_call:

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skipped: ${{ steps.validate.outputs.skipped }}
    steps:
      - name: Validate ref is main
        id: validate
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Skipping reset: not on main (ref=${{ github.ref }})"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "Running on main, proceeding with env branch reset"

      - name: Checkout main
        if: steps.validate.outputs.skipped != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git for push
        if: steps.validate.outputs.skipped != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          REPO="${{ github.repository }}"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"

      - name: Fetch and prune
        if: steps.validate.outputs.skipped != 'true'
        run: git fetch origin --prune

      - name: Reset env/dev from main
        if: steps.validate.outputs.skipped != 'true'
        run: |
          set -e
          BRANCH_NAME="env/dev"
          echo "=== Checking if ${BRANCH_NAME} needs reset ==="

          if ! git show-ref --verify --quiet "refs/remotes/origin/${BRANCH_NAME}"; then
            echo "Branch ${BRANCH_NAME} does not exist, skipping reset"
            exit 0
          fi

          ENV_BRANCH_SHA=$(git rev-parse "origin/${BRANCH_NAME}" 2>/dev/null || echo "")
          MAIN_BRANCH_SHA=$(git rev-parse "origin/main" 2>/dev/null || echo "")

          if [ -z "$ENV_BRANCH_SHA" ] || [ -z "$MAIN_BRANCH_SHA" ]; then
            echo "Could not get commit SHAs, skipping"
            exit 0
          fi

          if [ "$ENV_BRANCH_SHA" = "$MAIN_BRANCH_SHA" ]; then
            echo "Branch ${BRANCH_NAME} in sync with main, skipping reset"
            exit 0
          fi

          echo "Branch ${BRANCH_NAME} has diverged from main, resetting..."
          echo "  env/dev: ${ENV_BRANCH_SHA}"
          echo "  main:    ${MAIN_BRANCH_SHA}"

          echo "Deleting remote branch ${BRANCH_NAME}..."
          git push origin --delete "${BRANCH_NAME}" 2>&1 || {
            echo "Warning: Failed to delete branch ${BRANCH_NAME}, continuing..."
          }

          echo "Creating new branch ${BRANCH_NAME} from main..."
          git checkout -b "${BRANCH_NAME}" "origin/main" 2>&1 || {
            echo "Error: Failed to create local branch"
            exit 1
          }

          echo "Pushing new branch ${BRANCH_NAME} to origin..."
          git push origin "${BRANCH_NAME}" 2>&1 || {
            echo "Error: Failed to push branch"
            exit 1
          }

          echo "Successfully reset ${BRANCH_NAME} from main"
