# Reusable workflow: package Lambda layer zip → S3 → terraform plan/apply
# Mirrors lambda-layer-deploy packaging + lambda-terraform-deploy TF apply path.
name: Lambda Layer Terraform Deploy

on:
  workflow_call:
    inputs:
      layer_name:
        description: "Name of Lambda layer / codeitem"
        required: true
        type: string
      environment:
        description: "Target environment (dev/qat/stg/prd)"
        required: true
        type: string
      aws_region:
        description: "AWS region where resources are created. vars.AWS_REGION overrides this when set."
        required: true
        type: string
        default: "us-east-2"
      state_region:
        description: "Region of the Terraform state bucket and lock table"
        required: false
        type: string
        default: "us-east-2"
      python_version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"
      requirements_file:
        description: "Path to requirements.txt"
        required: false
        type: string
        default: "requirements.txt"
      layer_code_directory:
        description: "Directory containing layer code (defaults to 'python')"
        required: false
        type: string
        default: "python"
      terraform_version:
        description: "Terraform version"
        required: false
        type: string
        default: "1.14.3"
      terraform_directory:
        description: "Terraform working directory"
        required: false
        type: string
        default: "terraform"
      state_bucket:
        description: "S3 bucket for Terraform state (optional; vars preferred)."
        required: false
        type: string
        default: ""
      state_key:
        description: "S3 key for Terraform state"
        required: true
        type: string
      state_table:
        description: "DynamoDB table for state locking"
        required: false
        type: string
        default: ""
      kms_key_alias:
        description: "KMS key alias for S3 encryption of layer package"
        required: false
        type: string
        default: "alias/CloudBotPipelineKey"
      runner:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      aws_role_arn:
        description: "AWS IAM role ARN for OIDC"
        required: true
      aws_account_id:
        description: "AWS Account ID"
        required: true
      tf_state_bucket:
        description: "Optional TF state bucket (org/repo secret)."
        required: false
      gitlab_api_token:
        description: "GitLab API token for private packages"
        required: false

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Package Lambda Layer
        run: |
          set -e
          echo "=== Packaging Lambda Layer ==="

          LAYER_DIR="${{ inputs.layer_code_directory }}"
          if [ ! -d "${LAYER_DIR}" ]; then
            echo "❌ Error: '${LAYER_DIR}' directory not found"
            exit 1
          fi

          mkdir -p layer-package
          cp -r "${LAYER_DIR}" layer-package/

          REQ_FILE="${{ inputs.requirements_file }}"
          if [ -f "${LAYER_DIR}/requirements.txt" ]; then
            echo "Installing dependencies from ${LAYER_DIR}/requirements.txt..."
            if [ -n "${{ secrets.gitlab_api_token }}" ]; then
              pip install \
                --extra-index-url "https://__token__:${{ secrets.gitlab_api_token }}@gitlab.com/api/v4/projects/71621175/packages/pypi/simple" \
                -r "${LAYER_DIR}/requirements.txt" \
                -t "layer-package/${LAYER_DIR}/" || \
              pip install -r "${LAYER_DIR}/requirements.txt" -t "layer-package/${LAYER_DIR}/"
            else
              pip install -r "${LAYER_DIR}/requirements.txt" -t "layer-package/${LAYER_DIR}/"
            fi
          elif [ -f "${REQ_FILE}" ]; then
            echo "Installing dependencies from ${REQ_FILE}..."
            if [ -n "${{ secrets.gitlab_api_token }}" ]; then
              pip install \
                --extra-index-url "https://__token__:${{ secrets.gitlab_api_token }}@gitlab.com/api/v4/projects/71621175/packages/pypi/simple" \
                -r "${REQ_FILE}" \
                -t "layer-package/${LAYER_DIR}/" || \
              pip install -r "${REQ_FILE}" -t "layer-package/${LAYER_DIR}/"
            else
              pip install -r "${REQ_FILE}" -t "layer-package/${LAYER_DIR}/"
            fi
          else
            echo "No requirements.txt found, skipping dependency installation"
          fi

          (cd layer-package && zip -r ../layer.zip . -x "*.pyc" -x "*__pycache__*" -x "*.git*" -x "*.pytest_cache*")
          ls -lh layer.zip
          echo "✅ Lambda layer package created"

      - name: Upload layer package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-layer-package-${{ inputs.environment }}
          path: layer.zip
          retention-days: 1

  deploy:
    needs: [package]
    runs-on: ${{ inputs.runner }}
    environment:
      name: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download layer package artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-layer-package-${{ inputs.environment }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || inputs.aws_region }}
          role-session-name: github-actions-lambda-layer-terraform-deploy

      - name: Upload package to S3
        id: upload
        run: |
          set -e
          DEPLOY_REGION="${{ vars.AWS_REGION != '' && vars.AWS_REGION || inputs.aws_region }}"
          ACCOUNT_ID="${{ secrets.aws_account_id }}"
          ARTIFACTS_REGION="us-east-2"
          ARTIFACTS_BUCKET="cloudbot-codepipeline-artifacts-${ARTIFACTS_REGION}-${ACCOUNT_ID}"
          S3_KEY="lambda-packages/${{ inputs.layer_name }}/layer-${{ github.sha }}.zip"

          echo "Uploading layer.zip to s3://${ARTIFACTS_BUCKET}/${S3_KEY}"
          aws s3 cp layer.zip "s3://${ARTIFACTS_BUCKET}/${S3_KEY}" \
            --sse aws:kms \
            --sse-kms-key-id ${{ inputs.kms_key_alias }} \
            --region "${ARTIFACTS_REGION}"

          CODE_BUCKET="${ARTIFACTS_BUCKET}"
          CODE_KEY="${S3_KEY}"
          if [ "${DEPLOY_REGION}" != "${ARTIFACTS_REGION}" ]; then
            CODE_BUCKET="cloudbot-codepipeline-artifacts-fn-${DEPLOY_REGION}-${ACCOUNT_ID}"
            echo "Staging layer.zip for Lambda in ${DEPLOY_REGION}: s3://${CODE_BUCKET}/${CODE_KEY}"
            if ! aws s3api head-bucket --bucket "${CODE_BUCKET}" --region "${DEPLOY_REGION}" >/dev/null 2>&1; then
              echo "Creating code bucket ${CODE_BUCKET}"
              if [ "${DEPLOY_REGION}" = "us-east-1" ]; then
                aws s3api create-bucket --bucket "${CODE_BUCKET}" --region "${DEPLOY_REGION}" \
                  || aws s3api head-bucket --bucket "${CODE_BUCKET}" --region "${DEPLOY_REGION}"
              else
                aws s3api create-bucket --bucket "${CODE_BUCKET}" --region "${DEPLOY_REGION}" \
                  --create-bucket-configuration "LocationConstraint=${DEPLOY_REGION}" \
                  || aws s3api head-bucket --bucket "${CODE_BUCKET}" --region "${DEPLOY_REGION}"
              fi
              aws s3api put-public-access-block \
                --bucket "${CODE_BUCKET}" \
                --region "${DEPLOY_REGION}" \
                --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
              aws s3api put-bucket-encryption \
                --bucket "${CODE_BUCKET}" \
                --region "${DEPLOY_REGION}" \
                --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
            fi
            aws s3 cp layer.zip "s3://${CODE_BUCKET}/${CODE_KEY}" \
              --sse AES256 \
              --region "${DEPLOY_REGION}"
          fi

          echo "artifacts_bucket=${CODE_BUCKET}" >> $GITHUB_OUTPUT
          echo "s3_key=${CODE_KEY}" >> $GITHUB_OUTPUT
          echo "✅ Upload complete"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        working-directory: ${{ inputs.terraform_directory }}
        env:
          INPUT_STATE_BUCKET: ${{ inputs.state_bucket }}
          SECRET_STATE_BUCKET: ${{ secrets.tf_state_bucket }}
          AWS_ACCOUNT_ID: ${{ secrets.aws_account_id }}
          TF_STATE_REGION: ${{ inputs.state_region }}
          STATE_KEY: ${{ inputs.state_key }}
          STATE_TABLE: ${{ inputs.state_table }}
        run: |
          set -e
          STATE_BUCKET="${INPUT_STATE_BUCKET}"
          if [ -z "${STATE_BUCKET}" ]; then
            STATE_BUCKET="${SECRET_STATE_BUCKET}"
          fi
          if [ -z "${STATE_BUCKET}" ] && [ -n "${AWS_ACCOUNT_ID}" ]; then
            STATE_BUCKET="cloudbot-terraform-state-${TF_STATE_REGION}-${AWS_ACCOUNT_ID}"
            echo "Derived TF state bucket from aws_account_id"
          fi
          if [ -z "${STATE_BUCKET}" ]; then
            echo "❌ Terraform state bucket is empty."
            echo "Pass with.state_bucket (Variable), secrets.tf_state_bucket, or aws_account_id."
            exit 1
          fi
          echo "Backend key=${STATE_KEY}"
          LOCK_ARGS="-backend-config=use_lockfile=true"
          if [ -n "${STATE_TABLE}" ]; then
            LOCK_ARGS="-backend-config=dynamodb_table=${STATE_TABLE}"
            echo "Using DynamoDB state lock table=${STATE_TABLE}"
          else
            echo "Using S3 native state lockfile (use_lockfile=true)"
          fi
          # shellcheck disable=SC2086
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}" \
            ${LOCK_ARGS} \
            -backend-config="encrypt=true"

      - name: Terraform Plan and Apply
        working-directory: ${{ inputs.terraform_directory }}
        env:
          TF_VAR_artifacts_bucket: ${{ steps.upload.outputs.artifacts_bucket }}
          TF_VAR_s3_key: ${{ steps.upload.outputs.s3_key }}
          TF_VAR_layer_name: ${{ inputs.layer_name }}
          TF_VAR_stage_name: ${{ inputs.environment }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || inputs.aws_region }}
        run: |
          set -e
          terraform plan -no-color -out=tfplan
          terraform apply -auto-approve tfplan
          terraform output -json > outputs.json
          cat outputs.json

      - name: Upload terraform outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ inputs.environment }}
          path: ${{ inputs.terraform_directory }}/outputs.json
          retention-days: 30
