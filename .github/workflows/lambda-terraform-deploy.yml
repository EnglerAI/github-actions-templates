# Reusable workflow: package Lambda zip → S3 → terraform plan/apply
# Mirrors GitLab .default-lambda_package + .default-lambda_artifact_upload + plan/apply
name: Lambda Terraform Deploy

on:
  workflow_call:
    inputs:
      function_name:
        description: "Name of Lambda function / codeitem"
        required: true
        type: string
      environment:
        description: "Target environment (dev/qat/stg/prd)"
        required: true
        type: string
      aws_region:
        description: "AWS region where resources are created. vars.AWS_REGION overrides this when set."
        required: true
        type: string
        default: "us-east-2"
      state_region:
        description: "Region of the Terraform state bucket and lock table"
        required: false
        type: string
        default: "us-east-2"
      python_version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"
      requirements_file:
        description: "Path to requirements.txt"
        required: false
        type: string
        default: "requirements.txt"
      terraform_version:
        description: "Terraform version"
        required: false
        type: string
        default: "1.14.3"
      terraform_directory:
        description: "Terraform working directory"
        required: false
        type: string
        default: "terraform"
      state_bucket:
        description: "S3 bucket for Terraform state (optional; vars preferred). Do not pass via job outputs if the name contains a secret (e.g. account id)."
        required: false
        type: string
        default: ""
      state_key:
        description: "S3 key for Terraform state"
        required: true
        type: string
      state_table:
        description: "DynamoDB table for state locking"
        required: false
        type: string
        default: ""
      kms_key_alias:
        description: "KMS key alias for S3 encryption of Lambda package"
        required: false
        type: string
        default: "alias/CloudBotPipelineKey"
      runner:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      aws_role_arn:
        description: "AWS IAM role ARN for OIDC"
        required: true
      aws_account_id:
        description: "AWS Account ID"
        required: true
      cognito_user_pool_id:
        description: "Cognito User Pool ID for API Gateway authorizer"
        required: true
      tf_state_bucket:
        description: "Optional TF state bucket (org/repo secret). Used when inputs.state_bucket is empty."
        required: false
      gitlab_api_token:
        description: "GitLab API token for private packages"
        required: false

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Package Lambda function
        run: |
          set -e
          echo "=== Packaging Lambda Function ==="
          mkdir -p package

          if [ -f "${{ inputs.requirements_file }}" ]; then
            echo "Installing dependencies..."
            if [ -n "${{ secrets.gitlab_api_token }}" ]; then
              pip install \
                --extra-index-url "https://__token__:${{ secrets.gitlab_api_token }}@gitlab.com/api/v4/projects/71621175/packages/pypi/simple" \
                -r ${{ inputs.requirements_file }} \
                -t package/ || pip install -r ${{ inputs.requirements_file }} -t package/
            else
              pip install -r ${{ inputs.requirements_file }} -t package/
            fi
          else
            echo "No requirements.txt found, skipping dependency installation"
          fi

          if [ -f "lambda_function.py" ]; then
            cp lambda_function.py package/
          elif [ -f "app.py" ]; then
            cp app.py package/
          else
            echo "Error: No lambda_function.py or app.py found"
            exit 1
          fi

          # Include options_lambda.py when present (OPTIONS helper shares this zip)
          find . -maxdepth 1 -name "*.py" \
            ! -name "setup.py" \
            ! -name "test_*.py" \
            ! -name "*_test.py" \
            -exec cp {} package/ \;

          (cd package && zip -r ../function.zip . -x "*.pyc" -x "*__pycache__*" -x "*.git*")
          ls -lh function.zip
          echo "✅ Lambda package created"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package-${{ inputs.environment }}
          path: function.zip
          retention-days: 1

  deploy:
    needs: [package]
    runs-on: ${{ inputs.runner }}
    environment:
      name: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-package-${{ inputs.environment }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || inputs.aws_region }}
          role-session-name: github-actions-lambda-terraform-deploy

      - name: Upload package to S3
        id: upload
        run: |
          set -e
          DEPLOY_REGION="${{ vars.AWS_REGION != '' && vars.AWS_REGION || inputs.aws_region }}"
          ACCOUNT_ID="${{ secrets.aws_account_id }}"
          ARTIFACTS_REGION="us-east-2"
          ARTIFACTS_BUCKET="cloudbot-codepipeline-artifacts-${ARTIFACTS_REGION}-${ACCOUNT_ID}"
          S3_KEY="lambda-packages/${{ inputs.function_name }}/function-${{ github.sha }}.zip"

          echo "Uploading function.zip to s3://${ARTIFACTS_BUCKET}/${S3_KEY}"
          aws s3 cp function.zip "s3://${ARTIFACTS_BUCKET}/${S3_KEY}" \
            --sse aws:kms \
            --sse-kms-key-id ${{ inputs.kms_key_alias }} \
            --region "${ARTIFACTS_REGION}"

          CODE_BUCKET="${ARTIFACTS_BUCKET}"
          CODE_KEY="${S3_KEY}"
          if [ "${DEPLOY_REGION}" != "${ARTIFACTS_REGION}" ]; then
            CODE_BUCKET="cloudbot-codepipeline-artifacts-fn-${DEPLOY_REGION}-${ACCOUNT_ID}"
            echo "Staging function.zip for Lambda in ${DEPLOY_REGION}: s3://${CODE_BUCKET}/${CODE_KEY}"
            if ! aws s3api head-bucket --bucket "${CODE_BUCKET}" --region "${DEPLOY_REGION}" >/dev/null 2>&1; then
              echo "Creating code bucket ${CODE_BUCKET}"
              if [ "${DEPLOY_REGION}" = "us-east-1" ]; then
                aws s3api create-bucket --bucket "${CODE_BUCKET}" --region "${DEPLOY_REGION}" \
                  || aws s3api head-bucket --bucket "${CODE_BUCKET}" --region "${DEPLOY_REGION}"
              else
                aws s3api create-bucket --bucket "${CODE_BUCKET}" --region "${DEPLOY_REGION}" \
                  --create-bucket-configuration "LocationConstraint=${DEPLOY_REGION}" \
                  || aws s3api head-bucket --bucket "${CODE_BUCKET}" --region "${DEPLOY_REGION}"
              fi
              aws s3api put-public-access-block \
                --bucket "${CODE_BUCKET}" \
                --region "${DEPLOY_REGION}" \
                --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
              aws s3api put-bucket-encryption \
                --bucket "${CODE_BUCKET}" \
                --region "${DEPLOY_REGION}" \
                --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
            fi
            aws s3 cp function.zip "s3://${CODE_BUCKET}/${CODE_KEY}" \
              --sse AES256 \
              --region "${DEPLOY_REGION}"
          fi

          echo "artifacts_bucket=${CODE_BUCKET}" >> $GITHUB_OUTPUT
          echo "s3_key=${CODE_KEY}" >> $GITHUB_OUTPUT
          echo "✅ Upload complete"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        working-directory: ${{ inputs.terraform_directory }}
        env:
          INPUT_STATE_BUCKET: ${{ inputs.state_bucket }}
          SECRET_STATE_BUCKET: ${{ secrets.tf_state_bucket }}
          AWS_ACCOUNT_ID: ${{ secrets.aws_account_id }}
          TF_STATE_REGION: ${{ inputs.state_region }}
          STATE_KEY: ${{ inputs.state_key }}
          STATE_TABLE: ${{ inputs.state_table }}
        run: |
          set -e
          # Resolve here (not via caller job outputs): GHA redacts outputs that
          # contain secret substrings (e.g. account id inside the bucket name).
          STATE_BUCKET="${INPUT_STATE_BUCKET}"
          if [ -z "${STATE_BUCKET}" ]; then
            STATE_BUCKET="${SECRET_STATE_BUCKET}"
          fi
          if [ -z "${STATE_BUCKET}" ] && [ -n "${AWS_ACCOUNT_ID}" ]; then
            STATE_BUCKET="cloudbot-terraform-state-${TF_STATE_REGION}-${AWS_ACCOUNT_ID}"
            echo "Derived TF state bucket from aws_account_id"
          fi
          if [ -z "${STATE_BUCKET}" ]; then
            echo "❌ Terraform state bucket is empty."
            echo "Pass with.state_bucket (Variable), secrets.tf_state_bucket, or aws_account_id."
            exit 1
          fi
          echo "Backend key=${STATE_KEY}"
          LOCK_ARGS="-backend-config=use_lockfile=true"
          if [ -n "${STATE_TABLE}" ]; then
            # Explicit DynamoDB lock table (legacy); otherwise S3 native lockfile
            LOCK_ARGS="-backend-config=dynamodb_table=${STATE_TABLE}"
            echo "Using DynamoDB state lock table=${STATE_TABLE}"
          else
            echo "Using S3 native state lockfile (use_lockfile=true)"
          fi
          # shellcheck disable=SC2086
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}" \
            ${LOCK_ARGS} \
            -backend-config="encrypt=true"

      - name: Terraform Plan and Apply
        working-directory: ${{ inputs.terraform_directory }}
        env:
          TF_VAR_artifacts_bucket: ${{ steps.upload.outputs.artifacts_bucket }}
          TF_VAR_s3_key: ${{ steps.upload.outputs.s3_key }}
          TF_VAR_function_name: ${{ inputs.function_name }}
          TF_VAR_stage_name: ${{ inputs.environment }}
          TF_VAR_cognito_user_pool_id: ${{ secrets.cognito_user_pool_id }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || inputs.aws_region }}
        run: |
          set -e
          DEPLOY_REGION="${TF_VAR_aws_region}"
          ACCOUNT_ID="${{ secrets.aws_account_id }}"
          APIGW_CLOUDWATCH_ROLE_NAME="${APIGW_CLOUDWATCH_ROLE_NAME:-APIGatewayToCloudWatchLogs}"
          APIGW_CLOUDWATCH_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${APIGW_CLOUDWATCH_ROLE_NAME}"
          if aws iam get-role --role-name "${APIGW_CLOUDWATCH_ROLE_NAME}" >/dev/null 2>&1; then
            CURRENT_APIGW_ROLE=$(aws apigateway get-account --region "${DEPLOY_REGION}" --query cloudwatchRoleArn --output text)
            if [ -z "${CURRENT_APIGW_ROLE}" ] || [ "${CURRENT_APIGW_ROLE}" = "None" ] || [ "${CURRENT_APIGW_ROLE}" = "null" ]; then
              echo "Setting API Gateway CloudWatch role in ${DEPLOY_REGION} to ${APIGW_CLOUDWATCH_ROLE_ARN}"
              aws apigateway update-account \
                --region "${DEPLOY_REGION}" \
                --patch-operations "op=replace,path=/cloudwatchRoleArn,value=${APIGW_CLOUDWATCH_ROLE_ARN}"
              echo "Waiting for API Gateway account setting to propagate"
              sleep 20
            fi
          else
            echo "API Gateway CloudWatch role ${APIGW_CLOUDWATCH_ROLE_ARN} not found; stage logging may fail"
          fi
          terraform plan -no-color -out=tfplan
          terraform apply -auto-approve tfplan
          terraform output -json > outputs.json
          cat outputs.json

      - name: Upload terraform outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ inputs.environment }}
          path: ${{ inputs.terraform_directory }}/outputs.json
          retention-days: 30
