# Reusable workflow: build Vue SPA → S3 sync → CloudFront invalidation
# Mirrors GitLab .default-vue_build + .default-vue_deploy
name: Vue Static Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev/qat/stg/prd)"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: true
        type: string
        default: "us-east-2"
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "20"
      s3_bucket:
        description: "S3 bucket name for static assets"
        required: true
        type: string
      cloudfront_distribution_id:
        description: "CloudFront distribution ID"
        required: true
        type: string
      vite_mode:
        description: "Vite build mode (development/production)"
        required: false
        type: string
        default: "production"
      runner:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      aws_role_arn:
        description: "AWS IAM role ARN for OIDC"
        required: true
      aws_account_id:
        description: "AWS Account ID"
        required: true

jobs:
  deploy:
    runs-on: ${{ inputs.runner }}
    environment:
      name: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: github-actions-vue-static-deploy

      - name: Verify AWS Account
        run: |
          set -e
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          if [ "${ACTUAL_ACCOUNT}" != "${{ secrets.aws_account_id }}" ]; then
            echo "❌ Account mismatch: expected ${{ secrets.aws_account_id }}, got ${ACTUAL_ACCOUNT}"
            exit 1
          fi
          echo "✅ Authenticated to account ${ACTUAL_ACCOUNT}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vue application
        run: |
          set -e
          echo "Building Vue application for mode: ${{ inputs.vite_mode }}"
          npm run build -- --mode "${{ inputs.vite_mode }}"
          ls -lah dist/

      - name: Sync static assets to S3
        env:
          S3_BUCKET: ${{ inputs.s3_bucket }}
        run: |
          set -e
          echo "Deploying to s3://${S3_BUCKET}"

          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.txt" \
            --exclude "robots.txt" \
            --exclude "manifest.json"

          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --metadata-directive REPLACE

          if [ -f dist/robots.txt ]; then
            aws s3 cp dist/robots.txt "s3://${S3_BUCKET}/robots.txt" \
              --cache-control "public, max-age=3600"
          fi

          if [ -f dist/manifest.json ]; then
            aws s3 cp dist/manifest.json "s3://${S3_BUCKET}/manifest.json" \
              --cache-control "public, max-age=3600"
          fi

          echo "✅ S3 sync complete"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ inputs.cloudfront_distribution_id }}
        run: |
          set -e
          echo "Creating CloudFront invalidation for ${DISTRIBUTION_ID}"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation created: ${INVALIDATION_ID}"
          echo "✅ Vue static deploy complete"
