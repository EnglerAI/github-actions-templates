# Reusable workflow: Terraform plan/apply for INF > CMP > CON base infrastructure
name: INF CMP CON Terraform Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev/qat/stg/prd)"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: true
        type: string
        default: "us-east-2"
      terraform_version:
        description: "Terraform version"
        required: false
        type: string
        default: "1.14.3"
      terraform_directory:
        description: "Terraform working directory"
        required: false
        type: string
        default: "terraform"
      state_bucket:
        description: "S3 bucket for Terraform state"
        required: true
        type: string
      state_key:
        description: "S3 key for Terraform state"
        required: true
        type: string
      state_table:
        description: "DynamoDB table for state locking"
        required: false
        type: string
        default: ""
      auto_apply:
        description: "Automatically apply on push to env branches"
        required: false
        type: boolean
        default: true
      cluster_name_fallback:
        description: "Fallback when TF_VAR_CLUSTER_NAME_* secret is unset (e.g. repo name)"
        required: false
        type: string
        default: ""
    secrets:
      aws_role_arn:
        description: "AWS IAM role ARN for OIDC"
        required: true
      aws_account_id:
        description: "AWS account ID (fallback for default state bucket name)"
        required: false
      tf_state_bucket:
        description: "Optional TF state bucket secret when inputs.state_bucket is empty"
        required: false
      tf_var_cluster_name_dev:
        description: "Repository secret TF_VAR_CLUSTER_NAME_DEV"
        required: false
      tf_var_cluster_name_qat:
        description: "Repository secret TF_VAR_CLUSTER_NAME_QAT"
        required: false
      tf_var_cluster_name_stg:
        description: "Repository secret TF_VAR_CLUSTER_NAME_STG"
        required: false
      tf_var_cluster_name_prd:
        description: "Repository secret TF_VAR_CLUSTER_NAME_PRD"
        required: false
      tf_var_vpc_id_dev:
        description: "Repository secret VPC_ID_DEV"
        required: false
      tf_var_vpc_id_qat:
        description: "Repository secret VPC_ID_QAT"
        required: false
      tf_var_vpc_id_stg:
        description: "Repository secret VPC_ID_STG"
        required: false
      tf_var_vpc_id_prd:
        description: "Repository secret VPC_ID_PRD"
        required: false

jobs:
  deploy:
    # Nested reusable workflows inherit only the permissions granted here.
    # terraform-workflow.yml: PR comments (pull-requests) + drift issues (issues).
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    uses: EnglerAI/github-actions-templates/.github/workflows/terraform-workflow.yml@main
    with:
      environment: ${{ inputs.environment }}
      aws_region: ${{ inputs.aws_region }}
      terraform_version: ${{ inputs.terraform_version }}
      terraform_directory: ${{ inputs.terraform_directory }}
      state_bucket: ${{ inputs.state_bucket }}
      state_key: ${{ inputs.state_key }}
      state_table: ${{ inputs.state_table }}
      auto_apply: ${{ inputs.auto_apply }}
      inf_cmp_con_tf_vars: true
      cluster_name_fallback: ${{ inputs.cluster_name_fallback }}
    secrets:
      aws_role_arn: ${{ secrets.aws_role_arn }}
      aws_account_id: ${{ secrets.aws_account_id }}
      tf_state_bucket: ${{ secrets.tf_state_bucket }}
      tf_var_cluster_name_dev: ${{ secrets.tf_var_cluster_name_dev }}
      tf_var_cluster_name_qat: ${{ secrets.tf_var_cluster_name_qat }}
      tf_var_cluster_name_stg: ${{ secrets.tf_var_cluster_name_stg }}
      tf_var_cluster_name_prd: ${{ secrets.tf_var_cluster_name_prd }}
      tf_var_vpc_id_dev: ${{ secrets.tf_var_vpc_id_dev }}
      tf_var_vpc_id_qat: ${{ secrets.tf_var_vpc_id_qat }}
      tf_var_vpc_id_stg: ${{ secrets.tf_var_vpc_id_stg }}
      tf_var_vpc_id_prd: ${{ secrets.tf_var_vpc_id_prd }}
