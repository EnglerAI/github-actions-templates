# Reusable: build Dockerfile and push to GHCR (or configured registry)
name: Docker Build Push

on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name without registry (defaults to repo name)"
        required: false
        type: string
        default: ""
      environment:
        description: "Target environment (dev/qat/stg/prd)"
        required: true
        type: string
      aws_region:
        description: "AWS region (unused for GHCR; kept for parity)"
        required: false
        type: string
        default: "us-east-2"
      runner:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      gitlab_api_token:
        description: "Token for private GitLab PyPI (cloudbot_core)"
        required: false
      registry_username:
        description: "Optional registry username (defaults to github.actor)"
        required: false
      registry_password:
        description: "Optional registry password (defaults to GITHUB_TOKEN)"
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          set -e
          NAME="${{ inputs.image_name }}"
          if [ -z "${NAME}" ]; then
            NAME="${{ github.event.repository.name }}"
          fi
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          REGISTRY=$(echo "${REGISTRY}" | tr '[:upper:]' '[:lower:]')
          NAME=$(echo "${NAME}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.sha }}"
          ENV_TAG="${{ inputs.environment }}-latest"
          echo "image_uri=${REGISTRY}/${NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "env_tag=${ENV_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image: ${REGISTRY}/${NAME}:${TAG}"

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            GITLAB_API_TOKEN=${{ secrets.gitlab_api_token }}
          tags: |
            ${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_uri }}:${{ inputs.environment }}-latest
