name: TUL CLI CloudFormation Deploy

on:
  workflow_call:
    inputs:
      cli_name:
        description: "Name of CLI / codeitem"
        required: true
        type: string
      stack_name:
        description: "CloudFormation stack name (defaults to cli_name-stack)"
        required: false
        type: string
      environment:
        description: "Target environment (dev/qat/stg/prd)"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: true
        type: string
        default: "us-east-2"
      python_version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"
      template_file:
        description: "Path to CloudFormation template file"
        required: false
        type: string
        default: "template.yml"
      requirements_file:
        description: "Path to requirements.txt (relative to repo root)"
        required: false
        type: string
        default: "requirements.txt"
      cli_package_directory:
        description: "Directory containing CLI package (defaults to hello_cli)"
        required: false
        type: string
        default: "hello_cli"
      kms_key_alias:
        description: "KMS key alias for S3 encryption"
        required: false
        type: string
        default: "alias/CloudBotPipelineKey"
      runner:
        description: "Runner label (default: self-hosted)"
        required: false
        type: string
    secrets:
      aws_role_arn:
        description: "AWS IAM role ARN for OIDC"
        required: true
      aws_account_id:
        description: "AWS Account ID"
        required: true
      gitlab_api_token:
        description: "GitLab API token for private packages"
        required: false

jobs:
  package:
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    env:
      HOME: ${{ github.workspace }}/.home
    steps:
      - name: Setup Git
        uses: EnglerAI/github-actions-templates/.github/actions/setup-git-self-hosted@main

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: EnglerAI/github-actions-templates/.github/actions/setup-python-self-hosted@main
        with:
          python_version: ${{ inputs.python_version }}

      - name: Package CLI
        run: |
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"

          if command -v python3 &> /dev/null && python3 -m pip --version &>/dev/null; then
            PYTHON_CMD="python3"
          elif command -v python &> /dev/null && python -m pip --version &>/dev/null; then
            PYTHON_CMD="python"
          else
            echo "Error: Neither python nor python3 with pip is available"
            exit 1
          fi

          echo "=== Packaging CLI ==="
          CLI_DIR="${{ inputs.cli_package_directory }}"
          if [ ! -d "${CLI_DIR}" ]; then
            echo "❌ Error: '${CLI_DIR}' directory not found"
            exit 1
          fi

          mkdir -p cli-package
          cp -r "${CLI_DIR}" cli-package/

          REQ_FILE="${{ inputs.requirements_file }}"
          if [ -f "${CLI_DIR}/requirements.txt" ]; then
            $PYTHON_CMD -m pip install -r "${CLI_DIR}/requirements.txt" -t "cli-package/${CLI_DIR}/"
          elif [ -f "${REQ_FILE}" ]; then
            $PYTHON_CMD -m pip install -r "${REQ_FILE}" -t "cli-package/${CLI_DIR}/"
          else
            echo "No requirements.txt found, skipping dependency installation"
          fi

          (cd cli-package && zip -r ../cli.zip . -x "*.pyc" -x "*__pycache__*" -x "*.git*" -x "*.pytest_cache*")
          ls -lh cli.zip
          echo "✅ CLI package created"

      - name: Upload CLI package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tul-cli-package-${{ inputs.environment }}
          path: cli.zip
          retention-days: 7

  deploy:
    needs: [package]
    if: always() && needs.package.result == 'success'
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    env:
      HOME: ${{ github.workspace }}/.home
    outputs:
      stack_name: ${{ steps.deploy.outputs.stack_name }}
      artifact_uri: ${{ steps.deploy.outputs.artifact_uri }}
    environment:
      name: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Setup Git
        uses: EnglerAI/github-actions-templates/.github/actions/setup-git-self-hosted@main

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CLI package artifact
        uses: actions/download-artifact@v4
        with:
          name: tul-cli-package-${{ inputs.environment }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: github-actions-tul-cli-cf-deploy

      - name: Install AWS CLI
        uses: EnglerAI/github-actions-templates/.github/actions/install-aws-cli@main

      - name: Setup AWS Path
        uses: EnglerAI/github-actions-templates/.github/actions/setup-aws-path@main

      - name: Upload CLI package to S3
        run: |
          echo "=== Uploading CLI Package to S3 ==="
          ARTIFACTS_BUCKET="cloudbot-codepipeline-artifacts-${{ inputs.aws_region }}-${{ secrets.aws_account_id }}"
          S3_KEY="cli-packages/${{ inputs.cli_name }}/cli-${{ github.sha }}.zip"

          aws s3 cp cli.zip "s3://${ARTIFACTS_BUCKET}/${S3_KEY}" \
            --sse aws:kms \
            --sse-kms-key-id ${{ inputs.kms_key_alias }} \
            --region ${{ inputs.aws_region }}

          echo "s3_bucket=${ARTIFACTS_BUCKET}" >> $GITHUB_ENV
          echo "s3_key=${S3_KEY}" >> $GITHUB_ENV
          echo "✅ CLI package uploaded to S3"

      - name: Deploy CLI stack with CloudFormation
        id: deploy
        run: |
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
          if [ -f "$HOME/.local/bin/aws" ]; then
            export PATH="$HOME/.local/bin:$PATH"
          fi

          if [ -n "${{ inputs.stack_name }}" ]; then
            STACK_NAME="${{ inputs.stack_name }}"
          else
            STACK_NAME="${{ inputs.cli_name }}-stack"
          fi

          TEMPLATE_FILE="${{ inputs.template_file }}"
          if [ ! -f "${TEMPLATE_FILE}" ]; then
            echo "❌ Error: CloudFormation template not found: ${TEMPLATE_FILE}"
            exit 1
          fi

          aws cloudformation deploy \
            --template-file "${TEMPLATE_FILE}" \
            --stack-name "${STACK_NAME}" \
            --parameter-overrides \
              ARTIFACTSBUCKET=${{ env.s3_bucket }} \
              S3Key=${{ env.s3_key }} \
              ACCOUNTID=${{ secrets.aws_account_id }} \
              NAME=${{ inputs.cli_name }} \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --region ${{ inputs.aws_region }}

          ARTIFACT_URI="s3://${{ env.s3_bucket }}/${{ env.s3_key }}"
          echo "stack_name=${STACK_NAME}" >> $GITHUB_OUTPUT
          echo "artifact_uri=${ARTIFACT_URI}" >> $GITHUB_OUTPUT
          echo "✅ CloudFormation deployment completed"
