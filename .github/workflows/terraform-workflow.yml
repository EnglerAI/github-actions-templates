name: Terraform Workflow

on:
  workflow_call:
    inputs:
      terraform_version:
        description: "Terraform version"
        required: false
        type: string
        default: "1.12.2"
      terraform_directory:
        description: "Terraform working directory"
        required: false
        type: string
        default: "terraform"
      environment:
        description: "Target environment (dev/qat/stg/prd)"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: true
        type: string
        default: "us-east-2"
      state_bucket:
        description: "S3 bucket for Terraform state"
        required: true
        type: string
      state_key:
        description: "S3 key for Terraform state"
        required: true
        type: string
      state_table:
        description: "DynamoDB table for state locking"
        required: false
        type: string
        default: ""
      auto_apply:
        description: "Automatically apply changes (only for non-prod)"
        required: false
        type: boolean
        default: false
      inf_cmp_con_tf_vars:
        description: "Resolve TF_VAR_cluster_name/vpc_id from env-specific secrets (INF CMP CON)"
        required: false
        type: boolean
        default: false
      cluster_name_fallback:
        description: "Fallback cluster name when env TF_VAR_CLUSTER_NAME_* secret is unset"
        required: false
        type: string
        default: ""
    secrets:
      aws_role_arn:
        description: "AWS IAM role ARN for OIDC"
        required: true
      aws_account_id:
        description: "AWS account ID (fallback for default state bucket name)"
        required: false
      tf_state_bucket:
        description: "Optional TF state bucket secret when inputs.state_bucket is empty"
        required: false
      tf_var_cluster_name_dev:
        description: "Repository secret TF_VAR_CLUSTER_NAME_DEV"
        required: false
      tf_var_cluster_name_qat:
        description: "Repository secret TF_VAR_CLUSTER_NAME_QAT"
        required: false
      tf_var_cluster_name_stg:
        description: "Repository secret TF_VAR_CLUSTER_NAME_STG"
        required: false
      tf_var_cluster_name_prd:
        description: "Repository secret TF_VAR_CLUSTER_NAME_PRD"
        required: false
      tf_var_vpc_id_dev:
        description: "Repository secret VPC_ID_DEV"
        required: false
      tf_var_vpc_id_qat:
        description: "Repository secret VPC_ID_QAT"
        required: false
      tf_var_vpc_id_stg:
        description: "Repository secret VPC_ID_STG"
        required: false
      tf_var_vpc_id_prd:
        description: "Repository secret VPC_ID_PRD"
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # For PR comments

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Format Check
        id: fmt
        working-directory: ${{ inputs.terraform_directory }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init (no backend)
        working-directory: ${{ inputs.terraform_directory }}
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        working-directory: ${{ inputs.terraform_directory }}
        run: terraform validate -no-color

      - name: Comment on PR (validation results)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`

            <details><summary>Show Validation Output</summary>

            \`\`\`
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  plan:
    needs: [validate]
    # PR-only: apply job runs plan+apply on push to main/env/*; parallel plan would lock state.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: github-actions-terraform-plan

      - name: Terraform Init
        working-directory: ${{ inputs.terraform_directory }}
        env:
          INPUT_STATE_BUCKET: ${{ inputs.state_bucket }}
          SECRET_STATE_BUCKET: ${{ secrets.tf_state_bucket }}
          AWS_ACCOUNT_ID: ${{ secrets.aws_account_id }}
          AWS_REGION_INPUT: ${{ inputs.aws_region }}
          STATE_KEY: ${{ inputs.state_key }}
        run: |
          set -e
          STATE_BUCKET="${INPUT_STATE_BUCKET}"
          if [ -z "${STATE_BUCKET}" ]; then
            STATE_BUCKET="${SECRET_STATE_BUCKET}"
          fi
          if [ -z "${STATE_BUCKET}" ] && [ -n "${AWS_ACCOUNT_ID}" ]; then
            STATE_BUCKET="cloudbot-terraform-state-${AWS_REGION_INPUT}-${AWS_ACCOUNT_ID}"
          fi
          if [ -z "${STATE_BUCKET}" ]; then
            echo "❌ Terraform state bucket is empty."
            echo "Set vars.TF_STATE_BUCKET_* or secrets.TF_STATE_BUCKET_* or AWS_ACCOUNT_ID_*"
            exit 1
          fi
          if [ -z "${STATE_KEY}" ]; then
            echo "❌ Terraform state key is empty."
            exit 1
          fi
          echo "State bucket: ${STATE_BUCKET}"
          echo "State key: ${STATE_KEY}"
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION_INPUT}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Resolve INF CMP CON Terraform variables
        if: inputs.inf_cmp_con_tf_vars
        uses: EnglerAI/github-actions-templates/.github/actions/resolve-inf-cmp-con-tf-env@main
        with:
          environment: ${{ inputs.environment }}
          aws_region: ${{ inputs.aws_region }}
          cluster_name_fallback: ${{ inputs.cluster_name_fallback != '' && inputs.cluster_name_fallback || github.event.repository.name }}
        secrets:
          tf_var_cluster_name_dev: ${{ secrets.tf_var_cluster_name_dev }}
          tf_var_cluster_name_qat: ${{ secrets.tf_var_cluster_name_qat }}
          tf_var_cluster_name_stg: ${{ secrets.tf_var_cluster_name_stg }}
          tf_var_cluster_name_prd: ${{ secrets.tf_var_cluster_name_prd }}
          tf_var_vpc_id_dev: ${{ secrets.tf_var_vpc_id_dev }}
          tf_var_vpc_id_qat: ${{ secrets.tf_var_vpc_id_qat }}
          tf_var_vpc_id_stg: ${{ secrets.tf_var_vpc_id_stg }}
          tf_var_vpc_id_prd: ${{ secrets.tf_var_vpc_id_prd }}

      - name: Terraform Plan
        id: plan
        working-directory: ${{ inputs.terraform_directory }}
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
        continue-on-error: true

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: |
            ${{ inputs.terraform_directory }}/tfplan
            ${{ inputs.terraform_directory }}/plan.txt
          retention-days: 7

      - name: Comment on PR (plan results)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planPath = '${{ inputs.terraform_directory }}/plan.txt';
            let plan = 'Plan file not found';

            try {
              plan = fs.readFileSync(planPath, 'utf8');
              // Truncate if too long
              if (plan.length > 60000) {
                plan = plan.substring(0, 60000) + '\n\n... (plan truncated)';
              }
            } catch (err) {
              plan = 'Error reading plan file: ' + err.message;
            }

            const output = `#### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>

            **Environment:** \`${{ inputs.environment }}\`
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    needs: [validate]
    if: |
      github.event_name == 'push' &&
      (github.ref_name == 'main' || startsWith(github.ref_name, 'env/'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://console.aws.amazon.com/console/home?region=${{ inputs.aws_region }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: github-actions-terraform-apply

      - name: Terraform Init
        working-directory: ${{ inputs.terraform_directory }}
        env:
          INPUT_STATE_BUCKET: ${{ inputs.state_bucket }}
          SECRET_STATE_BUCKET: ${{ secrets.tf_state_bucket }}
          AWS_ACCOUNT_ID: ${{ secrets.aws_account_id }}
          AWS_REGION_INPUT: ${{ inputs.aws_region }}
          STATE_KEY: ${{ inputs.state_key }}
        run: |
          set -e
          STATE_BUCKET="${INPUT_STATE_BUCKET}"
          if [ -z "${STATE_BUCKET}" ]; then
            STATE_BUCKET="${SECRET_STATE_BUCKET}"
          fi
          if [ -z "${STATE_BUCKET}" ] && [ -n "${AWS_ACCOUNT_ID}" ]; then
            STATE_BUCKET="cloudbot-terraform-state-${AWS_REGION_INPUT}-${AWS_ACCOUNT_ID}"
          fi
          if [ -z "${STATE_BUCKET}" ]; then
            echo "❌ Terraform state bucket is empty."
            echo "Set vars.TF_STATE_BUCKET_* or secrets.TF_STATE_BUCKET_* or AWS_ACCOUNT_ID_*"
            exit 1
          fi
          if [ -z "${STATE_KEY}" ]; then
            echo "❌ Terraform state key is empty."
            exit 1
          fi
          echo "State bucket: ${STATE_BUCKET}"
          echo "State key: ${STATE_KEY}"
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION_INPUT}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Resolve INF CMP CON Terraform variables
        if: inputs.inf_cmp_con_tf_vars
        uses: EnglerAI/github-actions-templates/.github/actions/resolve-inf-cmp-con-tf-env@main
        with:
          environment: ${{ inputs.environment }}
          aws_region: ${{ inputs.aws_region }}
          cluster_name_fallback: ${{ inputs.cluster_name_fallback != '' && inputs.cluster_name_fallback || github.event.repository.name }}
        secrets:
          tf_var_cluster_name_dev: ${{ secrets.tf_var_cluster_name_dev }}
          tf_var_cluster_name_qat: ${{ secrets.tf_var_cluster_name_qat }}
          tf_var_cluster_name_stg: ${{ secrets.tf_var_cluster_name_stg }}
          tf_var_cluster_name_prd: ${{ secrets.tf_var_cluster_name_prd }}
          tf_var_vpc_id_dev: ${{ secrets.tf_var_vpc_id_dev }}
          tf_var_vpc_id_qat: ${{ secrets.tf_var_vpc_id_qat }}
          tf_var_vpc_id_stg: ${{ secrets.tf_var_vpc_id_stg }}
          tf_var_vpc_id_prd: ${{ secrets.tf_var_vpc_id_prd }}

      - name: Terraform Plan
        id: plan
        working-directory: ${{ inputs.terraform_directory }}
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan

      - name: Terraform Apply
        working-directory: ${{ inputs.terraform_directory }}
        run: |
          # For production, require manual approval (GitHub environment protection)
          # For non-prod with auto_apply, apply automatically
          if [[ "${{ inputs.environment }}" == "prd" ]] || [[ "${{ inputs.auto_apply }}" == "false" ]]; then
            echo "Manual approval required - using GitHub environment protection"
          fi

          terraform apply -auto-approve tfplan

      - name: Terraform Output
        id: output
        working-directory: ${{ inputs.terraform_directory }}
        run: |
          terraform output -json > outputs.json
          cat outputs.json

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ inputs.environment }}
          path: ${{ inputs.terraform_directory }}/outputs.json
          retention-days: 30

  drift-detection:
    needs: [apply]
    if: |
      always() &&
      needs.apply.result == 'success' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: github-actions-drift-detection

      - name: Terraform Init
        working-directory: ${{ inputs.terraform_directory }}
        env:
          INPUT_STATE_BUCKET: ${{ inputs.state_bucket }}
          SECRET_STATE_BUCKET: ${{ secrets.tf_state_bucket }}
          AWS_ACCOUNT_ID: ${{ secrets.aws_account_id }}
          AWS_REGION_INPUT: ${{ inputs.aws_region }}
          STATE_KEY: ${{ inputs.state_key }}
        run: |
          set -e
          STATE_BUCKET="${INPUT_STATE_BUCKET}"
          if [ -z "${STATE_BUCKET}" ]; then
            STATE_BUCKET="${SECRET_STATE_BUCKET}"
          fi
          if [ -z "${STATE_BUCKET}" ] && [ -n "${AWS_ACCOUNT_ID}" ]; then
            STATE_BUCKET="cloudbot-terraform-state-${AWS_REGION_INPUT}-${AWS_ACCOUNT_ID}"
          fi
          if [ -z "${STATE_BUCKET}" ]; then
            echo "❌ Terraform state bucket is empty."
            echo "Set vars.TF_STATE_BUCKET_* or secrets.TF_STATE_BUCKET_* or AWS_ACCOUNT_ID_*"
            exit 1
          fi
          if [ -z "${STATE_KEY}" ]; then
            echo "❌ Terraform state key is empty."
            exit 1
          fi
          echo "State bucket: ${STATE_BUCKET}"
          echo "State key: ${STATE_KEY}"
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION_INPUT}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Resolve INF CMP CON Terraform variables
        if: inputs.inf_cmp_con_tf_vars
        uses: EnglerAI/github-actions-templates/.github/actions/resolve-inf-cmp-con-tf-env@main
        with:
          environment: ${{ inputs.environment }}
          aws_region: ${{ inputs.aws_region }}
          cluster_name_fallback: ${{ inputs.cluster_name_fallback != '' && inputs.cluster_name_fallback || github.event.repository.name }}
        secrets:
          tf_var_cluster_name_dev: ${{ secrets.tf_var_cluster_name_dev }}
          tf_var_cluster_name_qat: ${{ secrets.tf_var_cluster_name_qat }}
          tf_var_cluster_name_stg: ${{ secrets.tf_var_cluster_name_stg }}
          tf_var_cluster_name_prd: ${{ secrets.tf_var_cluster_name_prd }}
          tf_var_vpc_id_dev: ${{ secrets.tf_var_vpc_id_dev }}
          tf_var_vpc_id_qat: ${{ secrets.tf_var_vpc_id_qat }}
          tf_var_vpc_id_stg: ${{ secrets.tf_var_vpc_id_stg }}
          tf_var_vpc_id_prd: ${{ secrets.tf_var_vpc_id_prd }}

      - name: Refresh State
        working-directory: ${{ inputs.terraform_directory }}
        run: terraform refresh -no-color
        continue-on-error: true

      - name: Detect Drift
        id: drift
        working-directory: ${{ inputs.terraform_directory }}
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color > drift-plan.txt
          DRIFT_STATUS=$?
          set -e

          echo "drift_status=${DRIFT_STATUS}" >> $GITHUB_OUTPUT

          if [ $DRIFT_STATUS -eq 0 ]; then
            echo "✅ No drift detected"
            echo "drift_detected=false" >> $GITHUB_OUTPUT
          elif [ $DRIFT_STATUS -eq 2 ]; then
            echo "⚠️  Drift detected"
            echo "drift_detected=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Error detecting drift"
            echo "drift_detected=error" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Create drift issue
        if: steps.drift.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const driftPlan = fs.readFileSync('${{ inputs.terraform_directory }}/drift-plan.txt', 'utf8');

            const issueBody = `## ⚠️ Terraform State Drift Detected

            **Environment:** \`${{ inputs.environment }}\`
            **Detection Time:** ${new Date().toISOString()}
            **Branch:** \`${{ github.ref_name }}\`
            **Commit:** \`${{ github.sha }}\`

            ### What This Means
            The actual infrastructure state differs from what Terraform expects. This usually means:
            1. Infrastructure was changed outside of Terraform
            2. State file is out of sync
            3. Code was updated but not yet applied

            ### Drift Details

            <details><summary>Show Drift</summary>

            \`\`\`terraform
            ${driftPlan.length > 60000 ? driftPlan.substring(0, 60000) + '\n... (truncated)' : driftPlan}
            \`\`\`

            </details>

            ### Recommended Actions
            1. Review the drift details above
            2. Run \`terraform plan\` locally to see changes
            3. Run \`terraform apply\` to sync state with infrastructure
            4. Investigate why infrastructure was changed outside Terraform

            *This issue was automatically created by the drift detection workflow.*`;

            // Check if drift issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['terraform-drift', '${{ inputs.environment }}']
            });

            if (issues.data.length === 0) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Terraform Drift Detected - ${{ inputs.environment }}`,
                body: issueBody,
                labels: ['terraform-drift', '${{ inputs.environment }}', 'infrastructure']
              });
            } else {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: issueBody
              });
            }
