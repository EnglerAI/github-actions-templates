# Reusable workflow: CloudFormation deploy for INF > MOD > CMP compute module
name: INF MOD CMP CloudFormation Deploy

on:
  workflow_call:
    inputs:
      stack_name:
        description: "CloudFormation stack name"
        required: true
        type: string
      codeitem_name:
        description: "Codeitem name for NAME parameter (defaults to repo name)"
        required: false
        type: string
        default: ""
      environment:
        description: "Target environment (dev/qat/stg/prd)"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: true
        type: string
        default: "us-east-2"
      template_file:
        description: "Path to CloudFormation template"
        required: false
        type: string
        default: "template.yml"
      runner:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      aws_role_arn:
        description: "AWS IAM role ARN for OIDC"
        required: true
      aws_account_id:
        description: "AWS Account ID"
        required: true
      accountid:
        description: "CloudBot Account ID (ACCOUNTID parameter)"
        required: false

jobs:
  deploy:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    environment:
      name: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: github-actions-inf-mod-cmp-cf-deploy

      - name: Verify AWS Identity and Account
        run: |
          set -e
          echo "=== AWS Identity Verification ==="
          IDENTITY=$(aws sts get-caller-identity)
          echo "$IDENTITY"
          ACTUAL_ACCOUNT=$(echo "$IDENTITY" | jq -r .Account)

          if [ "${ACTUAL_ACCOUNT}" != "${{ secrets.aws_account_id }}" ]; then
            echo "❌ ERROR: Account mismatch — expected ${{ secrets.aws_account_id }}, got ${ACTUAL_ACCOUNT}"
            exit 1
          fi
          echo "✅ Authenticated to correct account: ${{ inputs.environment }}"

      - name: Deploy INF MOD CMP CloudFormation
        run: |
          set -e
          echo "=== INF MOD CMP CF Deploy ==="

          STACK_NAME="${{ inputs.stack_name }}"
          TEMPLATE_FILE="${{ inputs.template_file }}"
          ENV="${{ inputs.environment }}"
          CODEITEM_NAME="${{ inputs.codeitem_name }}"
          AWS_REGION="${{ inputs.aws_region }}"
          AWS_ACCOUNT_ID="${{ secrets.aws_account_id }}"
          REPO_NAME="${{ github.event.repository.name }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [ -z "${CODEITEM_NAME}" ]; then
            CODEITEM_NAME="${REPO_NAME}"
          fi

          if [ ! -f "${TEMPLATE_FILE}" ]; then
            echo "❌ Error: Template file not found: ${TEMPLATE_FILE}"
            exit 1
          fi

          if [ ! -f "modules/compute.yml" ] && [ ! -f "modules/compute.yaml" ]; then
            echo "❌ Error: modules/compute.yml (nested stack module) not found"
            exit 1
          fi

          if [ -n "${{ secrets.accountid }}" ]; then
            ACCOUNTID="${{ secrets.accountid }}"
          else
            ACCOUNTID="${AWS_ACCOUNT_ID}"
          fi

          KMS_KEY_ALIAS="alias/CloudBotPipelineKey"
          PARAM_OVERRIDES="Environment=${ENV} ACCOUNTID=${ACCOUNTID} NAME=${CODEITEM_NAME}"
          MODULE_FILE="modules/compute.yml"
          if [ ! -f "${MODULE_FILE}" ]; then
            MODULE_FILE="modules/compute.yaml"
          fi

          # Prefer the assumed-role account over workflow inputs to avoid bucket/role mismatch.
          CALLER_IDENTITY=$(aws sts get-caller-identity --output json)
          CALLER_ACCOUNT=$(echo "${CALLER_IDENTITY}" | jq -r .Account)
          CALLER_ARN=$(echo "${CALLER_IDENTITY}" | jq -r .Arn)
          echo "AWS caller: ${CALLER_ARN}"
          if [ -n "${AWS_ACCOUNT_ID}" ] && [ "${AWS_ACCOUNT_ID}" != "${CALLER_ACCOUNT}" ]; then
            echo "WARNING: aws_account_id=${AWS_ACCOUNT_ID} != caller account ${CALLER_ACCOUNT}; using caller account for artifacts bucket"
          fi
          ARTIFACTS_BUCKET="cloudbot-codepipeline-artifacts-${AWS_REGION}-${CALLER_ACCOUNT}"
          PACKAGE_PREFIX="cfn-nested/${REPO_NAME}/${SHORT_SHA}"
          PACKAGED_TEMPLATE="packaged-template.yml"
          OBJECT_KEY="${PACKAGE_PREFIX}/compute.yml"

          echo "Stack: ${STACK_NAME}"
          echo "Template: ${TEMPLATE_FILE}"
          echo "Environment: ${ENV}"
          echo "Name: ${CODEITEM_NAME}"
          echo "Uploading nested module to s3://${ARTIFACTS_BUCKET}/${OBJECT_KEY} ..."

          if ! aws s3 cp "${MODULE_FILE}" "s3://${ARTIFACTS_BUCKET}/${OBJECT_KEY}" \
            --sse aws:kms \
            --sse-kms-key-id "${KMS_KEY_ALIAS}" \
            --region "${AWS_REGION}"; then
            echo "ERROR: s3:PutObject denied on ${ARTIFACTS_BUCKET}."
            echo "Caller: ${CALLER_ARN}"
            echo "Update CI role in account ${CALLER_ACCOUNT} so identity policy allows"
            echo "  arn:aws:s3:::cloudbot-codepipeline-artifacts-${AWS_REGION}-${CALLER_ACCOUNT}/*"
            echo "Bucket policy also requires SSE-KMS (alias/CloudBotPipelineKey)."
            exit 1
          fi

          TEMPLATE_URL="https://s3.${AWS_REGION}.amazonaws.com/${ARTIFACTS_BUCKET}/${OBJECT_KEY}"
          echo "Nested TemplateURL: ${TEMPLATE_URL}"
          sed -E \
            "s|TemplateURL:[[:space:]]*\\./modules/compute\\.ya?ml|TemplateURL: ${TEMPLATE_URL}|g" \
            "${TEMPLATE_FILE}" > "${PACKAGED_TEMPLATE}"

          echo "Packaged TemplateURL values:"
          BAD_URL=0
          URL_COUNT=0
          while IFS= read -r line; do
            url=$(echo "${line}" | sed -E 's/^[[:space:]]*TemplateURL:[[:space:]]*//')
            echo "  ${url}"
            URL_COUNT=$((URL_COUNT + 1))
            case "${url}" in
              https://*) ;;
              *)
                echo "Error: TemplateURL must start with https:// after package, got: ${url}"
                BAD_URL=1
                ;;
            esac
          done < <(grep -E 'TemplateURL:' "${PACKAGED_TEMPLATE}" || true)

          if [ "${BAD_URL}" -ne 0 ]; then
            exit 1
          fi
          if [ "${URL_COUNT}" -lt 1 ]; then
            echo "Error: no TemplateURL found in packaged template"
            exit 1
          fi

          echo "Deploying packaged parent stack ${STACK_NAME} ..."
          aws cloudformation deploy \
            --template-file "${PACKAGED_TEMPLATE}" \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides ${PARAM_OVERRIDES} \
            --no-fail-on-empty-changeset \
            --region "${AWS_REGION}"

          echo "✅ INF MOD CMP CF deploy completed"

      - name: Get stack info
        run: |
          echo "=== CloudFormation Stack Info ==="
          aws cloudformation describe-stacks \
            --stack-name "${{ inputs.stack_name }}" \
            --region "${{ inputs.aws_region }}" \
            --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' \
            --output table
