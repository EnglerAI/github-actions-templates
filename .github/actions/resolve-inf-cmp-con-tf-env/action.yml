name: Resolve INF CMP CON Terraform environment variables
description: >-
  Select TF_VAR_cluster_name and TF_VAR_vpc_id from env-specific GitHub secrets
  (DEV/QAT/STG/PRD), matching GitLab CI and CloudBot INF CMP CON patterns.
author: CloudBot Team

inputs:
  environment:
    description: Target environment (dev/qat/stg/prd)
    required: true
  aws_region:
    description: AWS region for TF_VAR_aws_region
    required: false
    default: us-east-2
  cluster_name_fallback:
    description: Fallback cluster name when env secret is unset (e.g. repository name)
    required: false
    default: ""

secrets:
  tf_var_cluster_name_dev:
    description: Repository secret TF_VAR_CLUSTER_NAME_DEV
    required: false
  tf_var_cluster_name_qat:
    description: Repository secret TF_VAR_CLUSTER_NAME_QAT
    required: false
  tf_var_cluster_name_stg:
    description: Repository secret TF_VAR_CLUSTER_NAME_STG
    required: false
  tf_var_cluster_name_prd:
    description: Repository secret TF_VAR_CLUSTER_NAME_PRD
    required: false
  tf_var_vpc_id_dev:
    description: Repository secret VPC_ID_DEV (TF_VAR_vpc_id)
    required: false
  tf_var_vpc_id_qat:
    description: Repository secret VPC_ID_QAT (TF_VAR_vpc_id)
    required: false
  tf_var_vpc_id_stg:
    description: Repository secret VPC_ID_STG (TF_VAR_vpc_id)
    required: false
  tf_var_vpc_id_prd:
    description: Repository secret VPC_ID_PRD (TF_VAR_vpc_id)
    required: false

runs:
  using: composite
  steps:
    - name: Export TF_VAR_* for environment
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        CLUSTER_FALLBACK: ${{ inputs.cluster_name_fallback }}
        AWS_REGION: ${{ inputs.aws_region }}
        CLUSTER_DEV: ${{ secrets.tf_var_cluster_name_dev }}
        CLUSTER_QAT: ${{ secrets.tf_var_cluster_name_qat }}
        CLUSTER_STG: ${{ secrets.tf_var_cluster_name_stg }}
        CLUSTER_PRD: ${{ secrets.tf_var_cluster_name_prd }}
        VPC_DEV: ${{ secrets.tf_var_vpc_id_dev }}
        VPC_QAT: ${{ secrets.tf_var_vpc_id_qat }}
        VPC_STG: ${{ secrets.tf_var_vpc_id_stg }}
        VPC_PRD: ${{ secrets.tf_var_vpc_id_prd }}
      run: |
        set -e
        case "${ENVIRONMENT}" in
          dev)
            TF_VAR_cluster_name="${CLUSTER_DEV}"
            TF_VAR_vpc_id="${VPC_DEV}"
            ;;
          qat)
            TF_VAR_cluster_name="${CLUSTER_QAT}"
            TF_VAR_vpc_id="${VPC_QAT}"
            ;;
          stg)
            TF_VAR_cluster_name="${CLUSTER_STG}"
            TF_VAR_vpc_id="${VPC_STG}"
            ;;
          prd)
            TF_VAR_cluster_name="${CLUSTER_PRD}"
            TF_VAR_vpc_id="${VPC_PRD}"
            ;;
          *)
            echo "❌ Unknown environment for INF CMP CON TF vars: ${ENVIRONMENT}"
            exit 1
            ;;
        esac

        if [ -z "${TF_VAR_cluster_name}" ] && [ -n "${CLUSTER_FALLBACK}" ]; then
          TF_VAR_cluster_name="${CLUSTER_FALLBACK}"
        fi

        if [ -z "${TF_VAR_cluster_name}" ]; then
          echo "❌ TF_VAR_cluster_name is required."
          echo "   Set TF_VAR_CLUSTER_NAME_<ENV> or cluster_name_fallback."
          exit 1
        fi

        if [ -z "${TF_VAR_vpc_id}" ]; then
          echo "❌ TF_VAR_vpc_id is required."
          echo "   Set VPC_ID_<ENV> repository secret."
          exit 1
        fi

        echo "TF_VAR_cluster_name=${TF_VAR_cluster_name}" >> "${GITHUB_ENV}"
        echo "TF_VAR_vpc_id=${TF_VAR_vpc_id}" >> "${GITHUB_ENV}"
        echo "TF_VAR_environment=${ENVIRONMENT}" >> "${GITHUB_ENV}"
        echo "TF_VAR_aws_region=${AWS_REGION}" >> "${GITHUB_ENV}"

        echo "INF CMP CON TF vars: cluster_name=${TF_VAR_cluster_name} environment=${ENVIRONMENT}"
