# Canonical deploy workflow for CloudFormation state machine codeitems.
# Placeholder: {{ REPO_NAME }} = repo directory name (e.g. create-codeitem).
# Used by codeitem-rollout to generate .github/workflows/deploy.yml per repo.
name: Deploy State Machine

on:
  push:
    branches:
      - main # Production
      - env/dev # Development
  pull_request:
    branches:
      - main
      - env/dev

# CKV2_GHA_1: Explicit least-privilege; each job overrides as needed
permissions: {}

jobs:
  # Step 1: Determine environment from branch
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      deploy_allowed: ${{ steps.env.outputs.deploy_allowed }}
      stack_name: ${{ steps.env.outputs.stack_name }}
    steps:
      - name: Determine environment from branch
        id: env
        run: |
          echo "=== Environment Determination ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"

          # For pull requests, use base branch
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.base_ref }}"
            DEPLOY_ALLOWED="false"
            echo "Pull request detected, target branch: ${BRANCH}"
          else
            BRANCH="${{ github.ref_name }}"
            DEPLOY_ALLOWED="true"
          fi

          # Route to environment based on branch
          case "${BRANCH}" in
            main)
              ENV="prd"
              STACK_NAME="{{ REPO_NAME }}-stack"
              ;;
            env/dev)
              ENV="dev"
              STACK_NAME="{{ REPO_NAME }}-stack"
              ;;
            *)
              ENV="unknown"
              STACK_NAME=""
              DEPLOY_ALLOWED="false"
              echo "⚠️  Unknown branch: ${BRANCH}"
              ;;
          esac

          echo "Environment: ${ENV}"
          echo "Deploy Allowed: ${DEPLOY_ALLOWED}"
          echo "Stack Name: ${STACK_NAME}"

          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "deploy_allowed=${DEPLOY_ALLOWED}" >> $GITHUB_OUTPUT
          echo "stack_name=${STACK_NAME}" >> $GITHUB_OUTPUT

  # Step 2: Verify documentation
  verify-docs:
    permissions:
      contents: read
      actions: write # For upload-artifact in reusable workflow
    uses: EnglerAI/github-actions-templates/.github/workflows/verify-docs.yml@main
    with:
      runner: ubuntu-latest

  # Step 3: Quality checks (state machine repos: no Python, cfn-lint only)
  quality:
    needs: [setup]
    permissions:
      id-token: write
      contents: read
    uses: EnglerAI/github-actions-templates/.github/workflows/quality-checks.yml@main
    with:
      runner: ubuntu-latest
      python_version: "3.12"
      run_flake8: false # State machine repos typically don't have Python code
      run_mypy: false
      run_cfn_lint: true
      upload_reports: ${{ needs.setup.outputs.deploy_allowed == 'true' }}
      use_pip_cache: false
    secrets:
      aws_role_arn: ${{ needs.setup.outputs.environment == 'dev' && secrets.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_PRD }}
      aws_account_id: ${{ needs.setup.outputs.environment == 'dev' && secrets.AWS_ACCOUNT_ID_DEV || secrets.AWS_ACCOUNT_ID_PRD }}
      accountid: ${{ secrets.ACCOUNTID }}

  # Step 4: Security scans
  security:
    needs: [setup]
    permissions:
      id-token: write
      contents: read
    uses: EnglerAI/github-actions-templates/.github/workflows/security-scans.yml@main
    with:
      runner: ubuntu-latest
      python_version: "3.12"
      run_bandit: false # State machine repos typically don't have Python code
      run_checkov: true
      run_radon: false
      upload_reports: ${{ needs.setup.outputs.deploy_allowed == 'true' }}
      use_pip_cache: false
    secrets:
      aws_role_arn: ${{ needs.setup.outputs.environment == 'dev' && secrets.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_PRD }}
      aws_account_id: ${{ needs.setup.outputs.environment == 'dev' && secrets.AWS_ACCOUNT_ID_DEV || secrets.AWS_ACCOUNT_ID_PRD }}
      accountid: ${{ secrets.ACCOUNTID }}

  # Step 5: Code analyzer
  code-analyzer:
    needs: [setup]
    if: needs.setup.outputs.deploy_allowed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: EnglerAI/github-actions-templates/.github/workflows/code-analyzer.yml@main
    with:
      runner: ubuntu-latest
      upload_reports: true
    secrets:
      aws_role_arn: ${{ needs.setup.outputs.environment == 'dev' && secrets.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_PRD }}
      aws_account_id: ${{ needs.setup.outputs.environment == 'dev' && secrets.AWS_ACCOUNT_ID_DEV || secrets.AWS_ACCOUNT_ID_PRD }}
      accountid: ${{ secrets.ACCOUNTID }}

  # Step 6: Deploy State Machine (only on allowed branches)
  deploy:
    needs: [setup, verify-docs, quality, security, code-analyzer]
    if: |
      always() &&
      needs.setup.outputs.deploy_allowed == 'true' &&
      github.event_name == 'push' &&
      (needs.verify-docs.result == 'success' || needs.verify-docs.result == 'skipped') &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (needs.code-analyzer.result == 'success' || needs.code-analyzer.result == 'skipped')
    permissions:
      id-token: write
      contents: read
    uses: EnglerAI/github-actions-templates/.github/workflows/cloudformation-deploy.yml@main
    with:
      runner: ubuntu-latest
      stack_name: ${{ needs.setup.outputs.stack_name }}
      environment: ${{ needs.setup.outputs.environment }}
      aws_region: us-east-2
      template_file: template.yml
      parameter_overrides: "NAME=${{ needs.setup.outputs.stack_name }} ARTIFACTSBUCKET=cloudbot-codepipeline-artifacts-us-east-2-000000000000 S3Key=not-applicable"
      capabilities: "CAPABILITY_IAM,CAPABILITY_NAMED_IAM"
      verify_s3_permissions: false # State machines don't typically need S3 uploads
    secrets:
      aws_role_arn: ${{ needs.setup.outputs.environment == 'dev' && secrets.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_PRD }}
      aws_account_id: ${{ needs.setup.outputs.environment == 'dev' && secrets.AWS_ACCOUNT_ID_DEV || secrets.AWS_ACCOUNT_ID_PRD }}
      accountid: ${{ secrets.ACCOUNTID }}

  # Step 8: Reset env/dev from main (after production deploy)
  reset-env-branches:
    needs: [deploy]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.deploy.result == 'success'
    permissions:
      contents: write
    uses: EnglerAI/github-actions-templates/.github/workflows/reset-env-branches.yml@main
